<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BankPatata - Pasarela de Pagos</title>
    <style>
        /* Estilos Generales */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        :root {
            --primary-color: #3a79f7;
            --secondary-color: #f0f4ff;
            --text-color: #333;
            --background-color: #f9f9f9;
            --white-color: #ffffff;
            --danger-color: #e74c3c;
            --success-color: #2ecc71;
            --light-gray: #f2f2f2;
            --dark-gray: #555;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--background-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
            background-image: url('https://i.imgur.com/UxSnQnT.jpeg');
            background-size: cover;
            background-position: center;
        }

        /* Contenedor Principal */
        .main-container {
            width: 100%;
            max-width: 420px;
            margin: 20px;
            perspective: 1000px;
        }

        .card-flipper {
            transition: transform 0.8s;
            transform-style: preserve-3d;
            position: relative;
            min-height: 550px; /* Asegura altura consistente */
        }
        
        .card-flipper.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            width: 100%;
            min-height: 550px;
            padding: 40px;
            background-color: var(--white-color);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            position: absolute;
            top: 0;
            left: 0;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .card-face--front {
             justify-content: center;
        }

        .card-face--back {
            transform: rotateY(180deg);
            justify-content: center;
        }
        
        .card-face--loader {
            transform: rotateY(0deg); /* Se muestra en la cara frontal */
            justify-content: center;
            z-index: 10;
        }

        /* Logo */
        .logo-container {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 250px;
            height: auto;
        }
        
        .logo-visa {
            width: 120px;
            height: auto;
            margin-bottom: 20px;
        }

        /* Formularios */
        .form-group {
            width: 100%;
            margin-bottom: 15px;
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 15px 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(58, 121, 247, 0.2);
        }

        /* Botones */
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: var(--white-color);
        }

        .btn-primary:hover {
            background-color: #2e67d4;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(58, 121, 247, 0.3);
        }

        .btn-success {
            background-color: var(--success-color);
            color: var(--white-color);
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: var(--white-color);
        }

        .button-group {
            display: flex;
            gap: 15px;
            width: 100%;
            margin-top: 20px;
        }

        /* Contenedor de Compra */
        .purchase-details {
            width: 100%;
            text-align: center;
        }

        .purchase-details h2 {
            font-size: 24px;
            margin-bottom: 15px;
        }

        .purchase-info {
            background-color: var(--secondary-color);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: left;
        }

        .purchase-info p {
            margin-bottom: 10px;
            font-size: 16px;
        }

        .purchase-info span {
            font-weight: 600;
            color: var(--primary-color);
        }
        
        .invoice-number {
             font-size: 18px;
             font-weight: 600;
             margin-bottom: 20px;
        }

        /* Animación de carga */
        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .loader-animation {
            border: 5px solid var(--light-gray);
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1.5s linear infinite;
            margin-top: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            margin-top: 20px;
            font-size: 18px;
            font-weight: 500;
            color: var(--dark-gray);
        }
        
        .loader-logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin-top: 25px;
        }

        .loader-logos img {
            max-height: 40px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        .loader-logos img:nth-child(2) {
            animation-delay: 0.3s;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        /* Modal de Notificación */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--white-color);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 90%;
            width: 380px;
        }
        
        .modal-content h3 {
             margin-bottom: 15px;
             font-size: 22px;
        }
        
         .modal-content p {
             margin-bottom: 25px;
             font-size: 16px;
             line-height: 1.6;
        }

        .modal-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.3s;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="card-flipper">
            <!-- Cara Frontal: Login -->
            <div class="card-face card-face--front" id="login-view">
                <div class="logo-container">
                    <img src="./images/bankpatatalogo.png" alt="Logo BankPatata" class="logo">
                </div>
                <form id="loginForm" style="width: 100%;">
                    <div class="form-group">
                        <input type="text" id="username" class="form-input" placeholder="Usuario" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="password" class="form-input" placeholder="Contraseña" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
                </form>
            </div>

            <!-- Cara Trasera: Compra -->
            <div class="card-face card-face--back" id="purchase-view">
                <div class="purchase-details">
                    <img src="./images/visa-logo.png" alt="Logo Visa" class="logo-visa">
                    <h2 class="invoice-number">Factura #<span id="invoiceNumber"></span></h2>
                    <div class="purchase-info">
                        <p><strong>Precio:</strong> <span id="price-html"></span></p>
                        <p><strong>Tienda:</strong> <span id="store-html"></span></p>
                        <p><strong>Descripción:</strong> <span id="description-html"></span></p>
                    </div>
                    <div class="button-group">
                        <button class="btn btn-danger reject-btn">Rechazar</button>
                        <button class="btn btn-success confirm-btn">Confirmar Pago</button>
                    </div>
                </div>
            </div>
            
             <!-- Cara de Carga -->
            <div class="card-face card-face--loader hidden" id="loader-view">
                <div class="loader-container">
                    <h3>Procesando Compra</h3>
                    <p>Por favor, espera un momento...</p>
                    <div class="loader-animation"></div>
                    <div class="loader-logos">
                        <img src="./images/visa-logo.png" alt="Visa Logo">
                        <img src="./images/bankpatatalogo.png" alt="BankPatata Icon">
                    </div>
                    <p class="loader-text">Tu transacción se está procesando de forma segura.</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal para Notificaciones -->
    <div id="notificationModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle"></h3>
            <p id="modalMessage"></p>
            <button id="modalCloseBtn" class="btn"></button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // --- ELEMENTOS DEL DOM ---
            const loginForm = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const cardFlipper = document.querySelector('.card-flipper');
            const loginView = document.getElementById('login-view');
            const purchaseView = document.getElementById('purchase-view');
            const loaderView = document.getElementById('loader-view');
            
            const confirmBtn = document.querySelector('.confirm-btn');
            const rejectBtn = document.querySelector('.reject-btn');

            // --- Modal ---
            const modal = document.getElementById('notificationModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const modalCloseBtn = document.getElementById('modalCloseBtn');

            // --- API de Trello ---
            const boardId = '4nP65kjP';
            const apiKey = '42c42b2aeb78d2b5048bc85c88041207';
            const token = '5d2c98ce4d6ca544fca293a91f7720b55d79832cdf431358705656707ea11e1b';

            // --- DATOS DE LA URL ---
            const urlParams = new URLSearchParams(window.location.search);
            const description = urlParams.get('description') || 'No especificada';
            const price = parseFloat(urlParams.get('price')) || 0;
            const store = urlParams.get('store') || 'Tienda Desconocida';
            
            // --- FUNCIONES ---
            function showNotification(title, message, type = 'info') {
                modalTitle.textContent = title;
                modalMessage.innerHTML = message;
                modalCloseBtn.textContent = 'Cerrar';
                modalCloseBtn.className = 'btn';
                
                if (type === 'success') modalCloseBtn.classList.add('btn-success');
                else if (type === 'error') modalCloseBtn.classList.add('btn-danger');
                else modalCloseBtn.classList.add('btn-primary');

                modal.style.display = 'flex';
            }

            modalCloseBtn.addEventListener('click', () => modal.style.display = 'none');
            window.addEventListener('click', (event) => {
                if (event.target == modal) modal.style.display = 'none';
            });
            
            function end_purchase() {
                 window.close();
            }

            function generateRandomID() {
                return Math.floor(10000 + Math.random() * 90000);
            }
            
            async function checkLogin(username, password) {
                try {
                    const response = await fetch(`https://api.trello.com/1/boards/${boardId}/cards?key=${apiKey}&token=${token}`);
                    if (!response.ok) throw new Error(`Error de red: ${response.statusText}`);
                    const cards = await response.json();

                    const user = cards.find(card => {
                        const cardNameParts = card.name.split(' | ');
                        if(cardNameParts.length >= 2) {
                            const [storedUsername, storedPassword] = cardNameParts;
                            return storedUsername.trim() === username && storedPassword.trim() === password;
                        }
                        return false;
                    });

                    if (user) {
                        document.getElementById('invoiceNumber').textContent = generateRandomID();
                        document.getElementById('price-html').textContent = `$${price.toFixed(2)}`;
                        document.getElementById('store-html').textContent = store;
                        document.getElementById('description-html').textContent = description;
                        
                        cardFlipper.classList.add('flipped');
                    } else {
                        showNotification('Error de Autenticación', 'El usuario o la contraseña son incorrectos.', 'error');
                    }
                } catch (error) {
                    console.error('Error al conectarse a Trello:', error);
                    showNotification('Error de Conexión', `No se pudo conectar con el servidor para iniciar sesión. <br>Por favor, comprueba tu conexión a internet.`, 'error');
                }
            }

            /**
             * [CORREGIDO] Procesa la transacción completa, actualizando saldos, movimientos y registrando la operación en Trello.
             */
            async function makeTransaction(userC, descriptionC, priceC, invoiceNumberC, storeC) {
                // Muestra la animación de carga
                loginView.classList.add('hidden');
                purchaseView.classList.add('hidden');
                loaderView.classList.remove('hidden');
                
                // Simula el tiempo de procesamiento de 10 segundos
                await new Promise(resolve => setTimeout(resolve, 8000));

                try {
                    // --- 1. OBTENER TODAS LAS TARJETAS UNA SOLA VEZ ---
                    const allCardsResponse = await fetch(`https://api.trello.com/1/boards/${boardId}/cards?key=${apiKey}&token=${token}`);
                    if (!allCardsResponse.ok) throw new Error('No se pudieron obtener los datos de Trello.');
                    const allCards = await allCardsResponse.json();

                    // --- 2. ENCONTRAR TODAS LAS TARJETAS NECESARIAS ---
                    const clientAccountCard = allCards.find(c => c.name.startsWith(`${userC} | `));
                    const clientMovementCard = allCards.find(c => c.name.startsWith(`${userC} / `));
                    const storeAccountCard = allCards.find(c => c.name.startsWith(`${storeC} | `));

                    // --- 3. VALIDAR QUE TODAS LAS TARJETAS EXISTEN ---
                    if (!clientAccountCard) throw new Error(`La cuenta del cliente '${userC}' no fue encontrada.`);
                    if (!clientMovementCard) throw new Error(`El historial de movimientos del cliente '${userC}' no fue encontrado.`);
                    if (!storeAccountCard) throw new Error(`La cuenta de la tienda '${storeC}' no fue encontrada.`);

                    // --- 4. VALIDAR CUENTA DEL CLIENTE Y FONDOS ---
                    const clientParts = clientAccountCard.name.split(' | ').map(p => p.trim());
                    if (clientParts[6] !== 'true') throw new Error("La tarjeta del cliente se encuentra bloqueada.");
                    
                    let clientBalance = clientParts[2];
                    if (clientBalance !== 'inf' && parseFloat(clientBalance) < priceC) {
                        throw new Error("Fondos insuficientes en la cuenta del cliente.");
                    }

                    // --- 5. ACTUALIZAR SALDOS (CLIENTE Y TIENDA) ---
                    // Cliente
                    if (clientBalance !== 'inf') {
                        const newClientBalance = (parseFloat(clientBalance) - priceC).toFixed(2);
                        clientParts[2] = newClientBalance;
                        const updatedClientName = clientParts.join(' | ');
                        await fetch(`https://api.trello.com/1/cards/${clientAccountCard.id}?key=${apiKey}&token=${token}&name=${encodeURIComponent(updatedClientName)}`, { method: 'PUT' });
                    }
                    // Tienda
                    const storeParts = storeAccountCard.name.split(' | ').map(p => p.trim());
                    let storeBalance = storeParts[2];
                    if (storeBalance !== 'inf') {
                        const newStoreBalance = (parseFloat(storeBalance) + priceC).toFixed(2);
                        storeParts[2] = newStoreBalance;
                        const updatedStoreName = storeParts.join(' | ');
                        await fetch(`https://api.trello.com/1/cards/${storeAccountCard.id}?key=${apiKey}&token=${token}&name=${encodeURIComponent(updatedStoreName)}`, { method: 'PUT' });
                    }

                    // --- 6. ACTUALIZAR TARJETA DE MOVIMIENTOS DEL CLIENTE ---
                    const newTransactionMovement = `${descriptionC} & ${priceC.toFixed(2)}`;
                    const updatedMovements = `${clientMovementCard.name} ! ${newTransactionMovement}`;
                    await fetch(`https://api.trello.com/1/cards/${clientMovementCard.id}?key=${apiKey}&token=${token}&name=${encodeURIComponent(updatedMovements)}`, { method: 'PUT' });
                    
                    // --- 7. REGISTRAR TRANSACCIÓN EN LA LISTA 'IDS' ---
                    const listsResponse = await fetch(`https://api.trello.com/1/boards/${boardId}/lists?key=${apiKey}&token=${token}`);
                    const lists = await listsResponse.json();
                    const idsList = lists.find(list => list.name === 'IDS');
                    if (!idsList) throw new Error("La lista 'IDS' no fue encontrada.");
                    
                    const isoDate = new Date().toISOString();
                    const logName = `#: ${invoiceNumberC} | TYPE: TRANSFER | FROM: ${userC} | TO: ${storeC} | DESC: ${descriptionC} | AMOUNT: ${priceC.toFixed(2)} | ISO_DATE: ${isoDate}`;
                    
                    const createLogResponse = await fetch(`https://api.trello.com/1/cards?key=${apiKey}&token=${token}&idList=${idsList.id}&name=${encodeURIComponent(logName)}`, { method: 'POST' });
                     if (!createLogResponse.ok) throw new Error("No se pudo crear el registro de la transacción.");

                    // --- 8. NOTIFICACIÓN DE ÉXITO ---
                    showNotification('¡Transacción Aprobada!', `La compra #${invoiceNumberC} por $${priceC.toFixed(2)} se ha completado.`, 'success');
                    modalCloseBtn.onclick = end_purchase;

                } catch (error) {
                    console.error('Error durante la transacción:', error);
                    showNotification('Transacción Rechazada', `Hubo un problema al procesar tu compra. <br><strong>Motivo:</strong> ${error.message}`, 'error');
                } finally {
                    loaderView.classList.add('hidden');
                }
            }

            // --- EVENT LISTENERS ---
            loginForm.addEventListener('submit', function(event) {
                event.preventDefault();
                checkLogin(usernameInput.value.trim(), passwordInput.value.trim());
            });

            confirmBtn.addEventListener('click', function() {
                makeTransaction(usernameInput.value, description, price, document.getElementById('invoiceNumber').textContent, store);
            });

            rejectBtn.addEventListener('click', function() {
                showNotification('Compra Cancelada', 'Has cancelado el proceso de pago.', 'info');
                modalCloseBtn.onclick = end_purchase;
            });
        });
    </script>
</body>
</html>
