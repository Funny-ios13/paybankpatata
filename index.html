<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BankPatata - Pasarela de Pagos</title>
    <style>
        /* Estilos Generales */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        :root {
            --primary-color: #3a79f7;
            --secondary-color: #f0f4ff;
            --text-color: #333;
            --background-color: #f9f9f9;
            --white-color: #ffffff;
            --danger-color: #e74c3c;
            --success-color: #2ecc71;
            --light-gray: #f2f2f2;
            --dark-gray: #555;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--background-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
            background-image: url('https://i.imgur.com/UxSnQnT.jpeg');
            background-size: cover;
            background-position: center;
        }

        /* Contenedor Principal */
        .main-container {
            width: 100%;
            max-width: 420px;
            margin: 20px;
            perspective: 1000px;
        }

        .card-flipper {
            transition: transform 0.8s;
            transform-style: preserve-3d;
            position: relative;
        }
        
        .card-flipper.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            width: 100%;
            padding: 40px;
            background-color: var(--white-color);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            position: absolute;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .card-face--front {
            /* z-index: 2; */ /* No es necesario */
        }

        .card-face--back {
            transform: rotateY(180deg);
        }
        
        /* Contenedor de Carga */
        .card-face--loader {
            transform: rotateY(180deg);
            background: var(--white-color);
        }
        
        .card-flipper.loading .card-face--front {
            display: none;
        }
        
        .card-flipper.loading .card-face--back {
            display: none;
        }

        /* Logo */
        .logo-container {
            text-align: center;
            margin-bottom: 25px;
        }

        .logo {
            width: 250px;
            height: auto;
        }
        
        .logo-visa {
            width: 120px;
            height: auto;
            margin-bottom: 20px;
        }

        /* Formularios */
        .form-group {
            width: 100%;
            margin-bottom: 15px;
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 15px 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(58, 121, 247, 0.2);
        }

        /* Botones */
        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: var(--white-color);
        }

        .btn-primary:hover {
            background-color: #2e67d4;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(58, 121, 247, 0.3);
        }

        .btn-success {
            background-color: var(--success-color);
            color: var(--white-color);
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: var(--white-color);
        }

        .button-group {
            display: flex;
            gap: 15px;
            width: 100%;
            margin-top: 20px;
        }

        /* Contenedor de Compra */
        .purchase-details {
            width: 100%;
            text-align: center;
        }

        .purchase-details h2 {
            font-size: 24px;
            margin-bottom: 15px;
        }

        .purchase-info {
            background-color: var(--secondary-color);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: left;
        }

        .purchase-info p {
            margin-bottom: 10px;
            font-size: 16px;
        }

        .purchase-info span {
            font-weight: 600;
            color: var(--primary-color);
        }
        
        .invoice-number {
             font-size: 18px;
             font-weight: 600;
             margin-bottom: 20px;
        }

        /* Animación de carga */
        .loader-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 350px;
        }

        .loader-animation {
            border: 5px solid var(--light-gray);
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1.5s linear infinite;
            margin-top: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            margin-top: 20px;
            font-size: 18px;
            font-weight: 500;
            color: var(--dark-gray);
        }
        
        .loader-logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 30px;
            margin-top: 25px;
        }

        .loader-logos img {
            max-height: 40px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        .loader-logos img:nth-child(2) {
            animation-delay: 0.3s;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.8; }
        }

        /* Modal de Notificación */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background-color: var(--white-color);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 90%;
            width: 380px;
        }
        
        .modal-content h3 {
             margin-bottom: 15px;
             font-size: 22px;
        }
        
         .modal-content p {
             margin-bottom: 25px;
             font-size: 16px;
             line-height: 1.6;
        }

        .modal-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.3s;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="card-flipper">
            <!-- Cara Frontal: Login -->
            <div class="card-face card-face--front" id="login-view">
                <div class="logo-container">
                    <img src="./images/bankpatatalogo.png" alt="Logo BankPatata" class="logo">
                </div>
                <form id="loginForm" style="width: 100%;">
                    <div class="form-group">
                        <input type="text" id="username" class="form-input" placeholder="Usuario" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="password" class="form-input" placeholder="Contraseña" required>
                    </div>
                    <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
                </form>
            </div>

            <!-- Cara Trasera: Compra -->
            <div class="card-face card-face--back" id="purchase-view">
                <div class="purchase-details">
                    <img src="./images/visa-logo.png" alt="Logo Visa" class="logo-visa">
                    <h2 class="invoice-number">Factura #<span id="invoiceNumber"></span></h2>
                    <div class="purchase-info">
                        <p><strong>Precio:</strong> <span id="price-html"></span></p>
                        <p><strong>Tienda:</strong> <span id="store-html"></span></p>
                        <p><strong>Descripción:</strong> <span id="description-html"></span></p>
                    </div>
                    <div class="button-group">
                        <button class="btn btn-danger reject-btn">Rechazar</button>
                        <button class="btn btn-success confirm-btn">Confirmar Pago</button>
                    </div>
                </div>
            </div>
            
             <!-- Cara de Carga -->
            <div class="card-face card-face--loader hidden" id="loader-view">
                <div class="loader-container">
                    <h3>Procesando Compra</h3>
                    <p>Por favor, espera un momento...</p>
                    <div class="loader-animation"></div>
                    <div class="loader-logos">
                        <img src="./images/visa-logo.png" alt="Visa Logo">
                        <img src="./images/bankpatatalogo.png" alt="BankPatata Icon">
                    </div>
                    <p class="loader-text">Tu transacción se está procesando de forma segura.</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Modal para Notificaciones -->
    <div id="notificationModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle"></h3>
            <p id="modalMessage"></p>
            <button id="modalCloseBtn" class="btn"></button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // --- ELEMENTOS DEL DOM ---
            const loginForm = document.getElementById('loginForm');
            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            const cardFlipper = document.querySelector('.card-flipper');
            const loginView = document.getElementById('login-view');
            const purchaseView = document.getElementById('purchase-view');
            const loaderView = document.getElementById('loader-view');
            
            const confirmBtn = document.querySelector('.confirm-btn');
            const rejectBtn = document.querySelector('.reject-btn');

            // --- Modal ---
            const modal = document.getElementById('notificationModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const modalCloseBtn = document.getElementById('modalCloseBtn');

            // --- API de Trello ---
            const boardId = '4nP65kjP';
            const apiKey = '42c42b2aeb78d2b5048bc85c88041207';
            const token = '5d2c98ce4d6ca544fca293a91f7720b55d79832cdf431358705656707ea11e1b';

            // --- DATOS DE LA URL ---
            const urlParams = new URLSearchParams(window.location.search);
            const description = urlParams.get('description') || 'No especificada';
            const price = parseFloat(urlParams.get('price')) || 0;
            const store = urlParams.get('store') || 'Tienda Desconocida';
            
            // --- FUNCIONES ---
            
            /**
             * Muestra el modal de notificaciones con un mensaje y título específicos.
             * @param {string} title - El título del modal.
             * @param {string} message - El mensaje a mostrar.
             * @param {'success' | 'error' | 'info'} type - El tipo de notificación.
             */
            function showNotification(title, message, type = 'info') {
                modalTitle.textContent = title;
                modalMessage.innerHTML = message; // Usamos innerHTML para permitir saltos de línea
                
                modalCloseBtn.textContent = 'Cerrar';
                modalCloseBtn.className = 'btn'; // Reset class
                
                if (type === 'success') {
                    modalCloseBtn.classList.add('btn-success');
                } else if (type === 'error') {
                    modalCloseBtn.classList.add('btn-danger');
                } else {
                    modalCloseBtn.classList.add('btn-primary');
                }

                modal.style.display = 'flex';
            }

            // Evento para cerrar el modal
            modalCloseBtn.addEventListener('click', () => {
                modal.style.display = 'none';
                // Si la transacción fue rechazada o hubo un error, podría ser útil no cerrar la ventana.
                // end_purchase(); // Comentado para que el usuario decida.
            });
            
            window.addEventListener('click', (event) => {
                if (event.target == modal) {
                    modal.style.display = 'none';
                }
            });
            
             /**
             * Cierra la ventana actual.
             */
            function end_purchase() {
                // Ya no usamos confirm, cerramos directamente o mostramos modal final.
                 window.close();
            }

            /**
             * Genera un ID de factura aleatorio de 5 dígitos.
             * @returns {number}
             */
            function generateRandomID() {
                return Math.floor(10000 + Math.random() * 90000);
            }
            
            /**
             * Verifica las credenciales del usuario contra la API de Trello.
             * @param {string} username - El nombre de usuario.
             * @param {string} password - La contraseña.
             */
            async function checkLogin(username, password) {
                try {
                    const response = await fetch(`https://api.trello.com/1/boards/${boardId}/cards?key=${apiKey}&token=${token}`);
                    if (!response.ok) throw new Error(`Error de red: ${response.statusText}`);
                    const cards = await response.json();

                    const user = cards.find(card => {
                        const cardNameParts = card.name.split(' | ');
                        if(cardNameParts.length >= 2) {
                            const [storedUsername, storedPassword] = cardNameParts;
                            return storedUsername.trim() === username && storedPassword.trim() === password;
                        }
                        return false;
                    });

                    if (user) {
                        document.getElementById('invoiceNumber').textContent = generateRandomID();
                        document.getElementById('price-html').textContent = `$${price.toFixed(2)}`;
                        document.getElementById('store-html').textContent = store;
                        document.getElementById('description-html').textContent = description;
                        
                        cardFlipper.classList.add('flipped');
                    } else {
                        showNotification('Error de Autenticación', 'El usuario o la contraseña son incorrectos. Por favor, inténtalo de nuevo.', 'error');
                    }
                } catch (error) {
                    console.error('Error al conectarse a Trello:', error);
                    showNotification('Error de Conexión', `No se pudo conectar con el servidor para iniciar sesión. <br>Por favor, comprueba tu conexión a internet.`, 'error');
                }
            }

            /**
             * Procesa la transacción completa, actualizando saldos y registrando la operación en Trello.
             * Esta es una versión refactorizada y simplificada de tu lógica original.
             * @param {string} userC - Usuario cliente.
             * @param {string} descriptionC - Descripción de la compra.
             * @param {number} priceC - Precio de la compra.
             * @param {string} invoiceNumberC - Número de factura.
             * @param {string} storeC - Nombre de la tienda.
             */
            async function makeTransaction(userC, descriptionC, priceC, invoiceNumberC, storeC) {
                // Mostrar animación de carga
                loginView.classList.add('hidden');
                purchaseView.classList.add('hidden');
                loaderView.classList.remove('hidden');
                
                // Simula el tiempo de procesamiento de 10 segundos
                await new Promise(resolve => setTimeout(resolve, 10000));

                try {
                    // 1. Obtener todas las listas del tablero
                    const listsResponse = await fetch(`https://api.trello.com/1/boards/${boardId}/lists?key=${apiKey}&token=${token}`);
                    const lists = await listsResponse.json();
                    const idsList = lists.find(list => list.name === 'IDS');

                    if (!idsList) {
                        throw new Error("La lista 'IDS' para registrar transacciones no fue encontrada.");
                    }

                    // 2. Crear la tarjeta de registro de la transacción
                    const formattedDate = new Date().toLocaleString('es-ES');
                    const cardName = `#${invoiceNumberC} | STORE: ${storeC} | ${userC} | ${descriptionC} | $${priceC.toFixed(2)} | ${formattedDate}`;
                    await fetch(`https://api.trello.com/1/cards?key=${apiKey}&token=${token}&idList=${idsList.id}&name=${cardName}`, {
                        method: 'POST'
                    });

                    // 3. Obtener todas las tarjetas para encontrar las de usuario y tienda
                    const cardsResponse = await fetch(`https://api.trello.com/1/boards/${boardId}/cards?key=${apiKey}&token=${token}`);
                    const cards = await cardsResponse.json();

                    // --- LÓGICA DEL CLIENTE ---
                    const clientAccountCard = cards.find(c => c.name.startsWith(`${userC} | `));
                    if (!clientAccountCard) throw new Error(`Cuenta del cliente '${userC}' no encontrada.`);

                    const clientParts = clientAccountCard.name.split(' | ').map(p => p.trim());
                    const isClientCardEnabled = clientParts[6] === 'true';
                    let clientBalance = clientParts[2];

                    if (!isClientCardEnabled) throw new Error("La tarjeta del cliente se encuentra bloqueada.");

                    if (clientBalance !== 'inf' && parseFloat(clientBalance) < priceC) {
                        throw new Error("Fondos insuficientes en la cuenta del cliente.");
                    }

                    // Actualizar saldo del cliente
                    if (clientBalance !== 'inf') {
                        const newClientBalance = (parseFloat(clientBalance) - priceC).toFixed(2);
                        clientParts[2] = newClientBalance;
                        const updatedClientAccountName = clientParts.join(' | ');
                        await fetch(`https://api.trello.com/1/cards/${clientAccountCard.id}?key=${apiKey}&token=${token}&name=${encodeURIComponent(updatedClientAccountName)}`, {
                            method: 'PUT'
                        });
                    }

                    // --- LÓGICA DE LA TIENDA ---
                    const storeAccountCard = cards.find(c => c.name.startsWith(`${storeC} | `));
                    if (storeAccountCard) {
                        const storeParts = storeAccountCard.name.split(' | ').map(p => p.trim());
                        let storeBalance = storeParts[2];
                        
                        if (storeBalance !== 'inf') {
                            const newStoreBalance = (parseFloat(storeBalance) + priceC).toFixed(2);
                            storeParts[2] = newStoreBalance;
                            const updatedStoreAccountName = storeParts.join(' | ');
                             await fetch(`https://api.trello.com/1/cards/${storeAccountCard.id}?key=${apiKey}&token=${token}&name=${encodeURIComponent(updatedStoreAccountName)}`, {
                                method: 'PUT'
                            });
                        }
                    }

                    // --- NOTIFICACIÓN DE ÉXITO ---
                    showNotification('¡Transacción Aprobada!', `La compra #${invoiceNumberC} por un valor de $${priceC.toFixed(2)} se ha completado con éxito.`, 'success');
                    modalCloseBtn.onclick = () => end_purchase();

                } catch (error) {
                    console.error('Error durante la transacción:', error);
                    showNotification('Transacción Rechazada', `Hubo un problema al procesar tu compra. <br><strong>Motivo:</strong> ${error.message}`, 'error');
                } finally {
                    // Ocultar la carga después del proceso
                    loaderView.classList.add('hidden');
                }
            }


            // --- EVENT LISTENERS ---
            
            loginForm.addEventListener('submit', function(event) {
                event.preventDefault();
                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();
                if (username && password) {
                    checkLogin(username, password);
                } else {
                    showNotification('Datos Incompletos', 'Por favor, introduce tu usuario y contraseña.', 'error');
                }
            });

            confirmBtn.addEventListener('click', function() {
                const user = usernameInput.value;
                const invoiceNumber = document.getElementById('invoiceNumber').textContent;
                makeTransaction(user, description, price, invoiceNumber, store);
            });

            rejectBtn.addEventListener('click', function() {
                showNotification('Compra Cancelada', 'Has cancelado el proceso de pago.', 'info');
                modalCloseBtn.onclick = () => end_purchase();
            });
        });
    </script>
</body>
</html>
